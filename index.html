<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>DAILY FIVE</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <header>
    <div class="eyebrow">Word Puzzle Game</div>
    <h1>DAILY FIVE</h1>
    <div class="sub">Guess the five-letter word in six tries.<br>Green means right spot, gold means wrong spot.</div>
  </header>

  <div id="board"></div>
  <div id="message"></div>
  <div id="keyboard"></div>

  <div id="result">
    <h2 id="resultTitle"></h2>
    <div id="shareGrid"></div>
    <div class="btn-group">
      <button id="shareBtn" class="btn primary-btn">Copy Result</button>
      <button id="playAgainBtn" class="btn secondary-btn">Play Again</button>
    </div>
    <div class="stats">
      <div><b id="statPlayed">0</b>played</div>
      <div><b id="statStreak">0</b>streak</div>
      <div><b id="statBest">0</b>best</div>
    </div>
  </div>

  <script src="script.js"></script>
</body>
</html>
